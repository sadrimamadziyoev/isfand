server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 2m;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; frame-src 'self'; frame-ancestors 'none'; form-action 'self'" always;
    location /api/ { proxy_pass http://api:8000; proxy_set_header Host $host; }
    location /t/ { access_log off; proxy_pass http://api:8000; proxy_set_header Host $host; }
    location = /training-preview { proxy_pass http://api:8000; }
    location / { try_files $uri $uri/ /index.html; }
}
